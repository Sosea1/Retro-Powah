# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = false
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = true

# Mod Information
mod_version = 0.1.0-beta
root_package = com.sosea1
mod_id = powah
mod_name = Powah! 1.12.2 Backport
mod_description = Unofficial Minecraft 1.12.2 backport of modern Powah!, originally created by owmii.
mod_url =
mod_update_json =
mod_authors = sosea1,owmii
mod_credits = Minecraft 1.12.2 backport by sosea1; original Powah! by owmii; modern upstream maintained by Technici4n and contributors; textures by Cyn and SammySemicolon.
mod_logo_path =

# Mappings
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = false

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Publishing is disabled for local development builds
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =
release_type = alpha
publish_with_changelog = false
client_side = true
server_side = true
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Minecraft source modification
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = false
mixin_booter_version = 11.13
generate_mixins_json = false
mixin_configs = mixins.${mod_id}.json
mixin_connector_class =
mixin_refmap = mixins.${mod_id}.refmap.json
mixin_package = ${root_package}.${mod_id}.mixin

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
